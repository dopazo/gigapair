[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.34.0"
# CI backends to support
ci = "github"
# Only the `gigapair` package ships: it holds every executable (app, CLI,
# service), so they install side by side.
packages = ["gigapair"]
# The installers to generate for each app
installers = ["shell", "powershell", "msi"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false
# Whether to enable GitHub Attestations
github-attestations = true
# Which actions to run on pull requests
pr-run-mode = "plan"
# main.wxs is edited by hand (Start menu shortcut for the app): don't
# regenerate it.
allow-dirty = ["msi"]

# GPUI needs these to build on Linux.
[dist.dependencies.apt]
libxkbcommon-dev = "*"
libxkbcommon-x11-dev = "*"
libwayland-dev = "*"
libvulkan-dev = "*"
libfontconfig-dev = "*"
libxcb1-dev = "*"
libx11-xcb-dev = "*"
libssl-dev = "*"
pkg-config = "*"

[package]
name = "gigapaird"
description = "Gigapair background service: owns the network node, queue and state"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
gigapair-core = { path = "../gigapair-core" }
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
tokio = { version = "1.54", features = ["full"] }
tracing = "0.1"
keepawake = "0.6"
notify-rust = "4.19"

[lints]
workspace = true

[package]
name = "gigapair"
description = "Peer-to-peer transfer of very large files between paired devices: desktop app, CLI and background service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors = ["Gigapair contributors"]
homepage = "https://github.com/dopazo/gigapair"
readme = "../../README.md"
publish = false
# `cargo run -p gigapair` opens the desktop app.
default-run = "gigapair-app"

# Every executable lives here, as a thin wrapper over its crate, so that a
# release (dist) ships them together: the app and the CLI start `gigapaird`
# from their own folder.

# Released by dist even though it isn't published to crates.io.
[package.metadata.dist]
dist = true

[package.metadata.wix]
upgrade-guid = "7FC4FC57-C10D-482F-A782-408083EADDE1"
path-guid = "CAD8EA07-1DA5-41D0-8968-6D220CC8847B"
license = false
eula = false
# The firewall exception for gigapaird (main.wxs) needs this extension.
compiler-args = ["-ext", "WixFirewallExtension"]
linker-args = ["-ext", "WixFirewallExtension"]

[dependencies]
gigapair-app = { path = "../gigapair-app" }
gigapair-cli = { path = "../gigapair-cli" }
gigapaird = { path = "../gigapaird" }
anyhow = "1"

[build-dependencies]
# Windows icon resource (MIT/Apache-2.0).
embed-resource = "3"

[lints]
workspace = true

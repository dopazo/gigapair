[package]
name = "gigapair-app"
description = "Gigapair desktop app (GPUI)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "gigapair-app"
path = "src/main.rs"

[dependencies]
gigapair-core = { path = "../gigapair-core" }
# Pre-1.0: pinned exactly; upgrade deliberately.
gpui-kit = "=0.9.1"
anyhow = "1"
tokio = { version = "1.54", features = ["full"] }
qrcode = { version = "0.14", default-features = false }

[lints]
workspace = true

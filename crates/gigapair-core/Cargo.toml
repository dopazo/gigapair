[package]
name = "gigapair-core"
description = "Gigapair transfer logic and protocol, independent of any UI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
iroh = "=1.4.1"
tokio = { version = "1.54", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
blake3 = { version = "1.8", features = ["rayon"] }
rusqlite = { version = "0.42", features = ["bundled"] }
directories = "6"
toml = "1"
keyring = "4.2"
interprocess = { version = "2.4", features = ["tokio"] }
data-encoding = "2.11"
rand = "0.10"
filetime = "0.2"
tokio-util = "0.7"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Console"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
